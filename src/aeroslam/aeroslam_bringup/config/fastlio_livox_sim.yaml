# FAST-LIO configuration for the simulated Livox Mid-360 on the hector_quadrotor.
# Topics are fed by livox_laser_simulation (+ aeroslam_livox_bridge) and the
# hector IMU relay.
common:
    lid_topic:  "/livox/lidar"
    imu_topic:  "/livox/imu"
    time_sync_en: false            # simulated clocks share /clock
    time_offset_lidar_to_imu: 0.0

preprocess:
    lidar_type: 1                  # 1: Livox (CustomMsg)
    scan_line: 4
    blind: 0.5

mapping:
    acc_cov: 0.1
    gyr_cov: 0.1
    b_acc_cov: 0.0001
    b_gyr_cov: 0.0001
    fov_degree: 360
    det_range: 70.0
    extrinsic_est_en: false
    extrinsic_T: [ 0.0, 0.0, 0.0 ] # livox_frame == base_link == IMU (simplified)
    extrinsic_R: [ 1, 0, 0,
                   0, 1, 0,
                   0, 0, 1 ]

publish:
    path_en: true
    scan_publish_en: true
    dense_publish_en: true
    scan_bodyframe_pub_en: true

pcd_save:
    pcd_save_en: false
    interval: -1
